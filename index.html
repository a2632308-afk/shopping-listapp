<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>쇼핑 리스트</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1c1e21;
    --muted: #6b7280;
    --border: #e3e5e8;
    --accent: #2f6feb;
    --danger: #d94a45;
    --warn-bg: #fdf2f2;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --card: #1f2226;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --border: #2e3237;
      --accent: #6a9bff;
      --danger: #ef6f6a;
      --warn-bg: #2b1e1e;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 40px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  .app {
    max-width: 520px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 24px 24px 20px;
    border-bottom: 1px solid var(--border);
  }
  .titles { flex: 1; min-width: 0; }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .summary { margin: 0; font-size: 14px; color: var(--muted); }

  .account {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
    max-width: 46%;
  }
  #who {
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    word-break: break-all;
  }
  .link {
    padding: 0;
    font: inherit;
    font-size: 13px;
    color: var(--accent);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
  }
  .link[hidden] { display: none; }

  #authPanel {
    padding: 16px 24px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  #authPanel[hidden] { display: none; }
  .auth-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .auth-row input {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .auth-row input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  .auth-actions { display: flex; gap: 8px; }
  .auth-actions button {
    flex: 1;
    padding: 9px 12px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
  }
  #loginBtn { color: #fff; background: var(--accent); border: none; }
  #signupBtn { color: var(--accent); background: none; border: 1px solid var(--accent); }
  .auth-actions button:disabled { opacity: .55; cursor: not-allowed; }
  .hint { margin: 9px 0 0; font-size: 12px; color: var(--muted); }

  #status {
    padding: 11px 24px;
    font-size: 14px;
    color: var(--danger);
    background: var(--warn-bg);
    border-bottom: 1px solid var(--border);
  }
  #status[hidden] { display: none; }

  form {
    display: flex;
    gap: 8px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  #input {
    flex: 1;
    min-width: 0;
    padding: 11px 14px;
    font: inherit;
    font-size: 15px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  #input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  #add {
    flex: none;
    padding: 11px 20px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #add:hover:not(:disabled) { filter: brightness(1.08); }
  #add:active:not(:disabled) { transform: translateY(1px); }
  #input:disabled, #add:disabled { opacity: .55; cursor: not-allowed; }

  ul { list-style: none; margin: 0; padding: 0; }

  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 24px;
    border-bottom: 1px solid var(--border);
  }
  li:last-child { border-bottom: none; }

  li input[type="checkbox"] {
    flex: none;
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .name {
    flex: 1;
    min-width: 0;
    word-break: break-word;
    cursor: pointer;
    user-select: none;
  }
  li.done .name {
    color: var(--muted);
    text-decoration: line-through;
  }

  .delete {
    flex: none;
    width: 30px;
    height: 30px;
    font-size: 19px;
    line-height: 1;
    color: var(--muted);
    background: none;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .delete:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }

  .empty {
    padding: 44px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 15px;
  }
  .empty[hidden] { display: none; }

  footer {
    display: flex;
    justify-content: flex-end;
    padding: 14px 24px;
    border-top: 1px solid var(--border);
  }
  footer[hidden] { display: none; }
  #clear {
    padding: 7px 13px;
    font: inherit;
    font-size: 14px;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
  }
  #clear:hover { color: var(--danger); border-color: var(--danger); }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="titles">
      <h1>🛒 쇼핑 리스트</h1>
      <p class="summary" id="summary">불러오는 중…</p>
    </div>
    <div class="account">
      <span id="who"></span>
      <button type="button" class="link" id="authToggle" hidden>로그인 / 가입</button>
      <button type="button" class="link" id="logout" hidden>로그아웃</button>
    </div>
  </header>

  <div id="authPanel" hidden>
    <div class="auth-row">
      <input id="email" type="email" placeholder="이메일" autocomplete="email">
    </div>
    <div class="auth-row">
      <input id="password" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">
    </div>
    <div class="auth-actions">
      <button type="button" id="loginBtn">로그인</button>
      <button type="button" id="signupBtn">가입하기</button>
    </div>
    <p class="hint" id="authHint"></p>
  </div>

  <p id="status" role="alert" hidden></p>

  <form id="form">
    <input id="input" type="text" placeholder="살 것을 입력하세요" autocomplete="off" maxlength="100" disabled>
    <button id="add" type="submit" disabled>추가</button>
  </form>

  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>아직 담은 항목이 없습니다.<br>위에 입력해서 추가해 보세요.</p>

  <footer id="footer" hidden>
    <button id="clear" type="button">완료 항목 비우기</button>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  "use strict";

  // 브라우저에 공개되는 값입니다. RLS 정책으로 본인 항목만 접근하도록 제한되어 있으므로
  // 저장소에 그대로 올려도 안전합니다. service_role / secret 키는 절대 여기에 두지 마세요.
  const SUPABASE_URL = "https://hvrofcblxmnnpremmlcj.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_epj5HlVT60MS1m-4NtBLqw_y_46oody";

  const TABLE = "shopping_items";
  const LEGACY_KEY = "shopping-list.items";   // 예전 localStorage 저장 위치
  const MIGRATED_KEY = "shopping-list.migrated";

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const addBtn = document.getElementById("add");
  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  const footer = document.getElementById("footer");
  const summary = document.getElementById("summary");
  const status = document.getElementById("status");
  const clearBtn = document.getElementById("clear");

  const who = document.getElementById("who");
  const authToggle = document.getElementById("authToggle");
  const logoutBtn = document.getElementById("logout");
  const authPanel = document.getElementById("authPanel");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const loginBtn = document.getElementById("loginBtn");
  const signupBtn = document.getElementById("signupBtn");
  const authHint = document.getElementById("authHint");

  let items = [];
  let ready = false;
  let user = null;

  function showError(message) {
    status.textContent = message;
    status.hidden = false;
  }

  function clearError() {
    status.hidden = true;
  }

  function setEnabled(on) {
    ready = on;
    input.disabled = !on;
    addBtn.disabled = !on;
  }

  function render() {
    list.textContent = "";

    for (const item of items) {
      const li = document.createElement("li");
      if (item.done) li.className = "done";
      li.dataset.id = item.id;

      const check = document.createElement("input");
      check.type = "checkbox";
      check.checked = item.done;
      check.setAttribute("aria-label", `${item.name} 완료 표시`);

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = item.name;

      const del = document.createElement("button");
      del.type = "button";
      del.className = "delete";
      del.textContent = "×";
      del.title = "삭제";
      del.setAttribute("aria-label", `${item.name} 삭제`);

      li.append(check, name, del);
      list.append(li);
    }

    const done = items.filter((i) => i.done).length;
    const total = items.length;

    empty.hidden = total > 0 || !ready;
    footer.hidden = done === 0;
    summary.textContent = total === 0
      ? "항목이 없습니다"
      : `전체 ${total}개 · 담음 ${done}개 · 남음 ${total - done}개`;

    renderAccount();
  }

  async function fetchItems() {
    const { data, error } = await db
      .from(TABLE)
      .select("id, name, done")
      .order("created_at", { ascending: true });

    if (error) throw error;
    items = data;
  }

  // 예전 버전에서 localStorage 에 쌓여 있던 항목을 최초 1회만 옮긴다.
  async function migrateLegacyItems() {
    let legacy;
    try {
      if (localStorage.getItem(MIGRATED_KEY)) return;
      legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || "[]");
    } catch {
      return;
    }
    if (!Array.isArray(legacy)) return;

    const rows = legacy
      .filter((it) => it && typeof it.name === "string" && it.name.trim())
      .map((it) => ({ name: it.name.trim().slice(0, 100), done: it.done === true }));

    if (rows.length) {
      const { error } = await db.from(TABLE).insert(rows);
      if (error) throw error;
    }
    localStorage.setItem(MIGRATED_KEY, "1");
  }

  // 로그인 상태에 따라 헤더의 계정 영역과 안내 문구를 갱신한다.
  function renderAccount() {
    if (!ready) {           // 인증·로드가 끝나기 전에는 계정 영역을 노출하지 않는다.
      who.textContent = "";
      authToggle.hidden = true;
      logoutBtn.hidden = true;
      return;
    }

    const guest = !user || user.is_anonymous;
    who.textContent = guest ? "게스트 · 이 브라우저에만 저장됨" : user.email;
    authToggle.hidden = !guest;
    logoutBtn.hidden = guest;
    if (guest) {
      authHint.textContent = items.length
        ? `가입하면 지금 목록 ${items.length}개가 계정으로 함께 옮겨집니다. 로그인하면 해당 계정의 목록으로 바뀝니다.`
        : "가입하면 어느 브라우저·기기에서든 같은 목록을 볼 수 있습니다.";
    }
  }

  async function reload() {
    await fetchItems();
    render();
    renderAccount();
  }

  function authBusy(on) {
    loginBtn.disabled = on;
    signupBtn.disabled = on;
  }

  async function start() {
    try {
      const { data: { session } } = await db.auth.getSession();
      user = session?.user ?? null;

      if (!session) {
        const { data, error } = await db.auth.signInAnonymously();
        if (error) throw error;
        user = data.user;
      }

      await migrateLegacyItems();
      await fetchItems();

      setEnabled(true);
      clearError();
      render();
      renderAccount();
      input.focus();
    } catch (err) {
      setEnabled(false);
      summary.textContent = "연결할 수 없습니다";
      showError(`서버에 연결하지 못했습니다: ${err.message ?? err}`);
    }
  }

  authToggle.addEventListener("click", () => {
    authPanel.hidden = !authPanel.hidden;
    if (!authPanel.hidden) emailInput.focus();
  });

  // 가입: 현재 게스트라면 그 익명 계정을 그대로 승격시켜 기존 목록을 유지한다.
  signupBtn.addEventListener("click", async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) {
      showError("이메일과 비밀번호를 모두 입력하세요.");
      return;
    }

    authBusy(true);
    try {
      if (user?.is_anonymous) {
        const { data, error } = await db.auth.updateUser({ email, password });
        if (error) throw error;
        user = data.user;
      } else {
        const { data, error } = await db.auth.signUp({ email, password });
        if (error) throw error;
        user = data.user;
      }
      authPanel.hidden = true;
      passwordInput.value = "";
      clearError();
      await reload();
    } catch (err) {
      showError(`가입하지 못했습니다: ${err.message ?? err}`);
    } finally {
      authBusy(false);
    }
  });

  loginBtn.addEventListener("click", async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) {
      showError("이메일과 비밀번호를 모두 입력하세요.");
      return;
    }

    authBusy(true);
    try {
      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) throw error;
      user = data.user;
      authPanel.hidden = true;
      passwordInput.value = "";
      clearError();
      await reload();
    } catch (err) {
      showError(`로그인하지 못했습니다: ${err.message ?? err}`);
    } finally {
      authBusy(false);
    }
  });

  // 로그아웃 후에도 앱을 쓸 수 있도록 곧바로 새 게스트 세션을 만든다.
  logoutBtn.addEventListener("click", async () => {
    setEnabled(false);
    try {
      await db.auth.signOut();
      const { data, error } = await db.auth.signInAnonymously();
      if (error) throw error;
      user = data.user;
      clearError();
      // 계정 영역은 ready 가 true 일 때만 그려지므로 reload 보다 먼저 켠다.
      setEnabled(true);
      await reload();
    } catch (err) {
      showError(`로그아웃 처리 중 문제가 발생했습니다: ${err.message ?? err}`);
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = input.value.trim();
    if (!name || !ready) return;

    input.value = "";
    input.focus();

    const { data, error } = await db
      .from(TABLE)
      .insert({ name })
      .select("id, name, done")
      .single();

    if (error) {
      showError(`추가하지 못했습니다: ${error.message}`);
      input.value = name;
      return;
    }

    clearError();
    items.push(data);
    render();
  });

  list.addEventListener("click", async (e) => {
    const li = e.target.closest("li");
    if (!li || !ready) return;

    const item = items.find((i) => i.id === li.dataset.id);
    if (!item) return;

    if (e.target.classList.contains("delete")) {
      const removed = items;
      items = items.filter((i) => i.id !== item.id);
      render();

      const { error } = await db.from(TABLE).delete().eq("id", item.id);
      if (error) {
        items = removed;
        render();
        showError(`삭제하지 못했습니다: ${error.message}`);
        return;
      }
      clearError();
      return;
    }

    if (e.target.classList.contains("name") || e.target.type === "checkbox") {
      const next = !item.done;
      item.done = next;
      render();

      const { error } = await db.from(TABLE).update({ done: next }).eq("id", item.id);
      if (error) {
        item.done = !next;
        render();
        showError(`상태를 바꾸지 못했습니다: ${error.message}`);
        return;
      }
      clearError();
    }
  });

  clearBtn.addEventListener("click", async () => {
    if (!ready) return;

    const doneIds = items.filter((i) => i.done).map((i) => i.id);
    if (!doneIds.length) return;

    const kept = items;
    items = items.filter((i) => !i.done);
    render();

    const { error } = await db.from(TABLE).delete().in("id", doneIds);
    if (error) {
      items = kept;
      render();
      showError(`비우지 못했습니다: ${error.message}`);
      return;
    }
    clearError();
  });

  render();
  start();
})();
</script>

</body>
</html>
