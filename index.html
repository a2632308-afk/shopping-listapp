<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>쇼핑 리스트</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1c1e21;
    --muted: #6b7280;
    --border: #e3e5e8;
    --accent: #2f6feb;
    --danger: #d94a45;
    --warn-bg: #fdf2f2;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --card: #1f2226;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --border: #2e3237;
      --accent: #6a9bff;
      --danger: #ef6f6a;
      --warn-bg: #2b1e1e;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 40px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  .app {
    max-width: 520px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  header {
    padding: 24px 24px 20px;
    border-bottom: 1px solid var(--border);
  }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .summary { margin: 0; font-size: 14px; color: var(--muted); }

  #status {
    padding: 11px 24px;
    font-size: 14px;
    color: var(--danger);
    background: var(--warn-bg);
    border-bottom: 1px solid var(--border);
  }
  #status[hidden] { display: none; }

  form {
    display: flex;
    gap: 8px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  #input {
    flex: 1;
    min-width: 0;
    padding: 11px 14px;
    font: inherit;
    font-size: 15px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  #input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  #add {
    flex: none;
    padding: 11px 20px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #add:hover:not(:disabled) { filter: brightness(1.08); }
  #add:active:not(:disabled) { transform: translateY(1px); }
  #input:disabled, #add:disabled { opacity: .55; cursor: not-allowed; }

  ul { list-style: none; margin: 0; padding: 0; }

  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 24px;
    border-bottom: 1px solid var(--border);
  }
  li:last-child { border-bottom: none; }

  li input[type="checkbox"] {
    flex: none;
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .name {
    flex: 1;
    min-width: 0;
    word-break: break-word;
    cursor: pointer;
    user-select: none;
  }
  li.done .name {
    color: var(--muted);
    text-decoration: line-through;
  }

  .delete {
    flex: none;
    width: 30px;
    height: 30px;
    font-size: 19px;
    line-height: 1;
    color: var(--muted);
    background: none;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .delete:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }

  .empty {
    padding: 44px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 15px;
  }
  .empty[hidden] { display: none; }

  footer {
    display: flex;
    justify-content: flex-end;
    padding: 14px 24px;
    border-top: 1px solid var(--border);
  }
  footer[hidden] { display: none; }
  #clear {
    padding: 7px 13px;
    font: inherit;
    font-size: 14px;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
  }
  #clear:hover { color: var(--danger); border-color: var(--danger); }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>🛒 쇼핑 리스트</h1>
    <p class="summary" id="summary">불러오는 중…</p>
  </header>

  <p id="status" role="alert" hidden></p>

  <form id="form">
    <input id="input" type="text" placeholder="살 것을 입력하세요" autocomplete="off" maxlength="100" disabled>
    <button id="add" type="submit" disabled>추가</button>
  </form>

  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>아직 담은 항목이 없습니다.<br>위에 입력해서 추가해 보세요.</p>

  <footer id="footer" hidden>
    <button id="clear" type="button">완료 항목 비우기</button>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  "use strict";

  // 브라우저에 공개되는 값입니다. RLS 정책으로 본인 항목만 접근하도록 제한되어 있으므로
  // 저장소에 그대로 올려도 안전합니다. service_role / secret 키는 절대 여기에 두지 마세요.
  const SUPABASE_URL = "https://hvrofcblxmnnpremmlcj.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_epj5HlVT60MS1m-4NtBLqw_y_46oody";

  const TABLE = "shopping_items";
  const LEGACY_KEY = "shopping-list.items";   // 예전 localStorage 저장 위치
  const MIGRATED_KEY = "shopping-list.migrated";

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const addBtn = document.getElementById("add");
  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  const footer = document.getElementById("footer");
  const summary = document.getElementById("summary");
  const status = document.getElementById("status");
  const clearBtn = document.getElementById("clear");

  let items = [];
  let ready = false;

  function showError(message) {
    status.textContent = message;
    status.hidden = false;
  }

  function clearError() {
    status.hidden = true;
  }

  function setEnabled(on) {
    ready = on;
    input.disabled = !on;
    addBtn.disabled = !on;
  }

  function render() {
    list.textContent = "";

    for (const item of items) {
      const li = document.createElement("li");
      if (item.done) li.className = "done";
      li.dataset.id = item.id;

      const check = document.createElement("input");
      check.type = "checkbox";
      check.checked = item.done;
      check.setAttribute("aria-label", `${item.name} 완료 표시`);

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = item.name;

      const del = document.createElement("button");
      del.type = "button";
      del.className = "delete";
      del.textContent = "×";
      del.title = "삭제";
      del.setAttribute("aria-label", `${item.name} 삭제`);

      li.append(check, name, del);
      list.append(li);
    }

    const done = items.filter((i) => i.done).length;
    const total = items.length;

    empty.hidden = total > 0 || !ready;
    footer.hidden = done === 0;
    summary.textContent = total === 0
      ? "항목이 없습니다"
      : `전체 ${total}개 · 담음 ${done}개 · 남음 ${total - done}개`;
  }

  async function fetchItems() {
    const { data, error } = await db
      .from(TABLE)
      .select("id, name, done")
      .order("created_at", { ascending: true });

    if (error) throw error;
    items = data;
  }

  // 예전 버전에서 localStorage 에 쌓여 있던 항목을 최초 1회만 옮긴다.
  async function migrateLegacyItems() {
    let legacy;
    try {
      if (localStorage.getItem(MIGRATED_KEY)) return;
      legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || "[]");
    } catch {
      return;
    }
    if (!Array.isArray(legacy)) return;

    const rows = legacy
      .filter((it) => it && typeof it.name === "string" && it.name.trim())
      .map((it) => ({ name: it.name.trim().slice(0, 100), done: it.done === true }));

    if (rows.length) {
      const { error } = await db.from(TABLE).insert(rows);
      if (error) throw error;
    }
    localStorage.setItem(MIGRATED_KEY, "1");
  }

  async function start() {
    try {
      const { data: { session } } = await db.auth.getSession();
      if (!session) {
        const { error } = await db.auth.signInAnonymously();
        if (error) throw error;
      }

      await migrateLegacyItems();
      await fetchItems();

      setEnabled(true);
      clearError();
      render();
      input.focus();
    } catch (err) {
      setEnabled(false);
      summary.textContent = "연결할 수 없습니다";
      showError(`서버에 연결하지 못했습니다: ${err.message ?? err}`);
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = input.value.trim();
    if (!name || !ready) return;

    input.value = "";
    input.focus();

    const { data, error } = await db
      .from(TABLE)
      .insert({ name })
      .select("id, name, done")
      .single();

    if (error) {
      showError(`추가하지 못했습니다: ${error.message}`);
      input.value = name;
      return;
    }

    clearError();
    items.push(data);
    render();
  });

  list.addEventListener("click", async (e) => {
    const li = e.target.closest("li");
    if (!li || !ready) return;

    const item = items.find((i) => i.id === li.dataset.id);
    if (!item) return;

    if (e.target.classList.contains("delete")) {
      const removed = items;
      items = items.filter((i) => i.id !== item.id);
      render();

      const { error } = await db.from(TABLE).delete().eq("id", item.id);
      if (error) {
        items = removed;
        render();
        showError(`삭제하지 못했습니다: ${error.message}`);
        return;
      }
      clearError();
      return;
    }

    if (e.target.classList.contains("name") || e.target.type === "checkbox") {
      const next = !item.done;
      item.done = next;
      render();

      const { error } = await db.from(TABLE).update({ done: next }).eq("id", item.id);
      if (error) {
        item.done = !next;
        render();
        showError(`상태를 바꾸지 못했습니다: ${error.message}`);
        return;
      }
      clearError();
    }
  });

  clearBtn.addEventListener("click", async () => {
    if (!ready) return;

    const doneIds = items.filter((i) => i.done).map((i) => i.id);
    if (!doneIds.length) return;

    const kept = items;
    items = items.filter((i) => !i.done);
    render();

    const { error } = await db.from(TABLE).delete().in("id", doneIds);
    if (error) {
      items = kept;
      render();
      showError(`비우지 못했습니다: ${error.message}`);
      return;
    }
    clearError();
  });

  render();
  start();
})();
</script>

</body>
</html>
